      animation: marquee 30s linear infinite;

    /* ==========================================================================
    /* ==========================================================================
       ANIMACIÓN ICÓNICA DE MARA SRL / ADORATORIO STUDIO:
       "LA PÁGINA PEQUEÑA QUE DESPUÉS SE AGRANDA"
       1. La web inicia compacta (scale(0.72) translateY(5vh)) enmarcada sobre fondo oscuro arquitectónico (#1A1D20),
          con esquinas redondeadas (28px), borde fino y sombra tridimensional flotante de maqueta.
       2. Tras un momento donde se aprecia claramente la miniatura, se agranda y expande
          suavemente a pantalla completa (scale(1)), disolviendo el marco e integrándose al 100% de la ventana.
       3. Todo el interior de la web es de UN SOLO TONO DE FONDO (#E9E7E2).
       ========================================================================== */
    .page-scale-stage {
      background-color: #F0D030; /* El mismo amarillo identitario del manual de marca */
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      padding: 0;
      margin: 0;
      transition: background-color 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s;
    }

    .page-scale-stage.stage-expanded {
      background-color: #E9E7E2;
    }

    .page-scale-frame {
      width: 100%;
      min-height: 100vh;
      transform-origin: center top;
      transform: scale(0.72) translateY(5vh);
      border-radius: 28px;
      box-shadow: 0 45px 130px -15px rgba(44, 47, 52, 0.45), 0 0 0 1px rgba(44, 47, 52, 0.15);
      overflow: hidden;
      background-color: #E9E7E2;
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-radius 1.8s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, border-radius;
    }

    .page-scale-frame.expanded {
      transform: scale(1) translateY(0);
      border-radius: 0px;
      box-shadow: none;
    }

    /* Revelación del Encabezado */
    .header-reveal {
      transform: translateY(-100%);
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .page-entered .header-reveal {
      transform: translateY(0%);
    }

    /* Revelación de Texto desde Máscara (Overflow Mask Reveal) */
    .mask-reveal {
      overflow: hidden;
      display: inline-block;
      vertical-align: bottom;
    }
    .mask-reveal-inner {
      display: inline-block;
      transform: translateY(110%);
      transition: transform 1.1s cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .page-entered .mask-reveal-inner {
      transform: translateY(0%);
    }

    /* Zoom de entrada en imágenes */
    .hero-img-zoom {
      transform: scale(1.18);
      transition: transform 2s cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .page-entered .hero-img-zoom {
      transform: scale(1);
    }

    /* Animación de Despliegue Suave en Scroll */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(35px);
      transition: opacity 0.85s cubic-bezier(0.215, 0.61, 0.355, 1), transform 0.85s cubic-bezier(0.215, 0.61, 0.355, 1);
      will-change: opacity, transform;
    }
    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Drawer Animation */
    @keyframes slideLeft {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .animate-slideLeft {
      animation: slideLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
